# ===========================================================================
# PICKAXE SOULS
#
# A pick earns its own XP alongside its owner and gains one permanent trait
# at each threshold. The levels live on the ITEM, so the pick becomes the
# thing people care about: lose it and you lose the soul, hand it down and
# the soul goes with it.
#
# Wake a soul with /pick awaken while holding a pickaxe.
# ===========================================================================

enabled: true
max-level: 20

# XP to go from soul level L to L+1:  base x L^exponent
curve:
  base: 250
  exponent: 1.5

# How much of the block's mining xp the pick also earns. 1.0 = the same.
xp-share: 1.0

# The pick's lore (its bar and numbers) is redrawn every N blocks, so you can
# see it move without waiting for a level.
lore-refresh-every-blocks: 5

# Traits are deliberately few and small. A pick that does six things at once
# can't be balanced and stops being legible.
traits:
  keen_soul:
    name: "Keen — mines a little faster"
    level: 3
  mending_soul:
    name: "Mending — repairs itself as you dig"
    level: 6
    chance: 0.08
    repair: 2
  rich_soul:
    name: "Rich — +1% drops per soul level"
    level: 10
    per-level: 0.01
  lucky_soul:
    name: "Lucky — a rare key, now and then"
    level: 15
    chance: 0.001
    commands:
      - "crazyvouchers give {player} legendary-key 1"
  old_soul:
    name: "Old — the pick remembers everything"
    level: 20

messages:
  not-a-pick: "<red>Hold a pickaxe."
  already: "<gray>That pick already has a soul."
  awakened: "<gradient:#7de2ff:#e08cff>Something wakes in the pick.</gradient>"
  soul-level: "<gradient:#7de2ff:#e08cff>The pick sharpens.</gradient> <gray>Soul level {level}."
  trait: "<white>{trait}<gray> — earned, and permanent."
